<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typeClip">
      <rect x="255" y="132" width="0" height="26">
        <animate attributeName="width" values="0;480;480;0" keyTimes="0;0.5;0.85;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="210" fill="#0D1117"/>

  <!-- ================= NEURAL NETWORK (top-left) ================= -->
  <g stroke="#00D9FF" stroke-width="1" opacity="0.55">
    <line x1="55" y1="45" x2="95" y2="30" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="55" y1="45" x2="90" y2="65" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="95" y1="30" x2="90" y2="65" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" values="0;-8" dur="0.9s" repeatCount="indefinite"/>
    </line>
  </g>
  <circle cx="55" cy="45" r="4" fill="#00D9FF">
    <animate attributeName="r" values="4;5.5;4" dur="2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="95" cy="30" r="3.2" fill="#7C3AED">
    <animate attributeName="r" values="3.2;4.6;3.2" dur="2s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="65" r="3.2" fill="#7C3AED">
    <animate attributeName="r" values="3.2;4.6;3.2" dur="2s" begin="0.8s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= GLOWING ORB (top-right) ================= -->
  <circle cx="840" cy="38" r="16" fill="url(#orbGrad)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="14;18;14" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= NAME ================= -->
  <text x="450" y="110" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif"
        font-size="56" font-weight="800" letter-spacing="2" fill="url(#nameGrad)" filter="url(#glow)">
    AREEBA ZAKA
    <animate attributeName="opacity" values="0.82;1;0.82" dur="2.6s" repeatCount="indefinite"/>
  </text>

  <!-- ================= TYPEWRITER TAGLINE ================= -->
  <g clip-path="url(#typeClip)">
    <text x="255" y="150" font-family="'Fira Code', monospace" font-size="16" fill="#8b9bb0" letter-spacing="0.5">
      AI/ML Developer &#8226; Agentic AI Explorer &#8226; Full-Stack Developer
    </text>
  </g>
  <rect x="735" y="133" width="2" height="18" fill="#00D9FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- ================= DRIFTING CURSOR DOT ================= -->
  <circle r="3" fill="#00D9FF" opacity="0.55">
    <animateMotion path="M40,190 Q450,175 860,190" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= WAVING ROBOT PEEKING (bottom-right) ================= -->
  <g>
    <!-- body (mostly cropped by bottom edge) -->
    <rect x="832" y="172" width="26" height="30" rx="6" fill="#16202c" stroke="#00D9FF" stroke-width="1.2"/>

    <!-- antenna -->
    <line x1="845" y1="150" x2="845" y2="138" stroke="#7C3AED" stroke-width="2"/>
    <circle cx="845" cy="135" r="3" fill="#00D9FF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- head -->
    <circle cx="845" cy="163" r="19" fill="#16202c" stroke="#00D9FF" stroke-width="1.4"/>

    <!-- eyes (blink) -->
    <g>
      <ellipse cx="838" cy="162" rx="3.4" ry="3.4" fill="#00D9FF">
        <animate attributeName="ry" values="3.4;3.4;0.3;3.4;3.4" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="852" cy="162" rx="3.4" ry="3.4" fill="#00D9FF">
        <animate attributeName="ry" values="3.4;3.4;0.3;3.4;3.4" keyTimes="0;0.85;0.9;0.95;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <!-- pupils look around -->
      <g>
        <circle cx="838" cy="162" r="1.4" fill="#0D1117">
          <animate attributeName="cx" values="837;839.5;837" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="852" cy="162" r="1.4" fill="#0D1117">
          <animate attributeName="cx" values="851;853.5;851" dur="5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>

    <!-- smile -->
    <path d="M 838 170 Q 845 174 852 170" stroke="#00D9FF" stroke-width="1.2" fill="none" opacity="0.8"/>

    <!-- waving arm -->
    <g transform-origin="861px 174px">
      <line x1="861" y1="174" x2="882" y2="153" stroke="#00D9FF" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-14 861 174; 14 861 174; -14 861 174" dur="1.3s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>
</svg>
