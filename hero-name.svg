<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="210" fill="#0D1117"/>

  <!-- ================= GLOWING ORB (top-right) ================= -->
  <circle cx="840" cy="38" r="16" fill="url(#orbGrad)" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="14;18;14" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= GREETING (main glowing line, constant) ================= -->
  <text x="450" y="100" text-anchor="middle" font-family="'Trebuchet MS', Verdana, sans-serif"
        font-size="46" font-weight="800" letter-spacing="1" fill="url(#nameGrad)" filter="url(#glow)">
    Hi, I'm Areeba Zaka 👋
  </text>

  <!-- ================= ROTATING / FADING SKILLS ================= -->
  <g>
    <text x="450" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="600" fill="#00D9FF">
      Python
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.1567;0.1667;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="600" fill="#00D9FF">
      TensorFlow
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1667;0.1767;0.3233;0.3333;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="600" fill="#00D9FF">
      LangChain
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3433;0.49;0.5;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="600" fill="#00D9FF">
      React
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.6567;0.6667;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="600" fill="#00D9FF">
      Agentic AI
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6767;0.8233;0.8333;1" dur="15s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="160" text-anchor="middle" font-family="'Fira Code', monospace" font-size="30" font-weight="600" fill="#00D9FF">
      Computer Vision
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8333;0.8433;0.99;1" dur="15s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ================= DRIFTING CURSOR DOT ================= -->
  <circle r="3" fill="#00D9FF" opacity="0.55">
    <animateMotion path="M40,190 Q450,175 860,190" dur="11s" repeatCount="indefinite"/>
  </circle>
</svg>
